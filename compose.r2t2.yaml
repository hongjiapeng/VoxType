services:
  llama:
    # Official CPU image b11515, verified against the registry on 2026-10-10.
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:f8f71e3be397e868cdddfb9c404e3a263d9697f82fd7205f4737ac981feea4b8
    restart: unless-stopped
    ports:
      - "${R2T2_BIND_IP:-127.0.0.1}:8272:8272"
    volumes:
      - ./r2t2-data/models:/models:ro
      - ./services/r2t2-chat-template.jinja:/config/asr.jinja:ro
    command:
      - -m
      - /models/Confucius4-R2T2-Q4_K_M.gguf
      - --mmproj
      - /models/mmproj-Confucius4-R2T2-f16.gguf
      - --host
      - 127.0.0.1
      - --port
      - "8273"
      - --alias
      - r2t2-q4
      - -c
      - "8192"
      - -np
      - "1"
      - -ngl
      - "0"
      - --device
      - none
      - --no-mmproj-offload
      - --jinja
      - --chat-template-file
      - /config/asr.jinja
      - --log-disable
  adapter:
    build:
      context: .
      dockerfile: services/R2T2.Server/Dockerfile
    restart: unless-stopped
    # Share loopback with llama. Only the adapter port is published to the host.
    network_mode: "service:llama"
    depends_on:
      - llama
    environment:
      R2T2__ListenUrl: http://0.0.0.0:8272
      R2T2__UpstreamUrl: http://127.0.0.1:8273
      R2T2__ApiKey: "${R2T2_API_KEY:?Set R2T2_API_KEY before starting Compose}"
      R2T2__Model: r2t2-q4
      Logging__LogLevel__Default: Warning
      Logging__LogLevel__Microsoft.AspNetCore: Warning
